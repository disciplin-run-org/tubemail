[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tubemail-channel"
version = "1.1.0"
description = "Claude Code channel plugin relaying events between a worker session and the TubeMail hub"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jesper Jurcenoks" }]
requires-python = ">=3.10"
keywords = ["claude-code", "mcp", "disciplin-run", "agent-orchestration", "pty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.25",
    "httpx-sse>=0.4",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.10",
    "pytest-httpx>=0.30",
]

[project.scripts]
tubemail = "tubemail.__main__:main"
claude-tm = "tubemail.claude_tm:main"

[project.urls]
Homepage = "https://github.com/disciplin-run-org/tubemail"
Repository = "https://github.com/disciplin-run-org/tubemail"
Issues = "https://github.com/disciplin-run-org/tubemail/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["tubemail"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
