services:
  tubemail:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_PORT=8001
      - TUBEMAIL_SECRET=${TUBEMAIL_SECRET:?TUBEMAIL_SECRET is required}
      - TUBEMAIL_ALLOWED_ORIGINS=${TUBEMAIL_ALLOWED_ORIGINS:-}
    volumes:
      - tubemail-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tubemail
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

networks:
  tubemail:
    driver: bridge

volumes:
  tubemail-data:
