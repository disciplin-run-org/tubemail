name: Publish to PyPI

# Triggers on every published GitHub Release. The auto-bump workflow
# tags the commit; you create the release via `gh release create`; this
# workflow then builds both packages and uploads them via PyPI's
# Trusted Publisher OIDC flow (no API tokens).
#
# Trusted publisher registration (one-time, in PyPI account settings):
#
#   For `tubemail` and again for `tubemail-hub` — register a pending
#   publisher with:
#     PyPI Project Name = tubemail        (then again with tubemail-hub)
#     Owner             = disciplin-run-org
#     Repository name   = tubemail
#     Workflow name     = publish.yml
#     Environment name  = pypi
#
# After the first successful publish, the pending publisher becomes a
# real publisher and the registration is permanent.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build tubemail (channel)
        run: python -m build --outdir dist-channel ./channel
      - name: Build tubemail-hub (root)
        run: python -m build --outdir dist-hub .
      - name: Upload channel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-channel
          path: dist-channel/
      - name: Upload hub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-hub
          path: dist-hub/

  publish-tubemail:
    name: Publish tubemail to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tubemail
    permissions:
      id-token: write  # required for Trusted Publisher OIDC
    steps:
      - name: Download channel artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-channel
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-tubemail-hub:
    name: Publish tubemail-hub to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tubemail-hub
    permissions:
      id-token: write  # required for Trusted Publisher OIDC
    steps:
      - name: Download hub artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-hub
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
