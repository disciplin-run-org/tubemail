name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install forwarder
        run: pip install -e forwarder/ --no-build-isolation
      - name: Install hub
        run: pip install -e .[dev] --no-build-isolation
      - name: Run tests
        run: pytest
