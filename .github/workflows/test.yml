name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Bootstrap pip + setuptools
        # `--no-build-isolation` skips the auto-install of build deps,
        # so the runner's Python venv must already have setuptools >=
        # 65 + wheel for our editable installs to find a build backend.
        run: pip install --upgrade pip setuptools wheel
      - name: Install channel
        run: pip install -e channel/ --no-build-isolation
      - name: Install hub
        run: pip install -e .[dev] --no-build-isolation
      - name: Build frontend
        # The SPA fallback test exercises the full create_app() factory,
        # which only mounts the SPA static files when frontend/dist
        # exists. Build the bundle here so the test sees a real dist.
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Run tests
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
