[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tubemail"
version = "1.6.2"
description = "Orchestration hub routing work between Claude Code sessions via tubemail channel plugin"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jesper Jurcenoks" }]
requires-python = ">=3.10"
keywords = ["claude-code", "mcp", "mcp-server", "disciplin-run", "agent-orchestration", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "fastmcp>=2.14",
    "pydantic>=2.0",
    "httpx>=0.25",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.10",
    "httpx>=0.25",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/disciplin-run-org/tubemail"
Repository = "https://github.com/disciplin-run-org/tubemail"
Issues = "https://github.com/disciplin-run-org/tubemail/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["tubemail_hub"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
